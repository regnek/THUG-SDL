# Builds thugsdl.dll with the tools the README asks for (MSVC, Win32, vcpkg SDL2),
# so nobody has to install Visual Studio to try a change. The result is attached to the run as an artifact.
#
# Two builds of the same code are made:
#   thugsdl.dll                   CMake's default Release flags (optimized). Built this way, the unmodified
#                                 source comes out closest in size and code to the DLL shipped in Game/.
#   alt-unoptimized/thugsdl.dll   optimization off, which is what the README's build section asks for.
#                                 The fallback in case the optimizer breaks something.
name: Build thugsdl.dll

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flickit recognizer tests
        run: |
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_test.cpp src/Flickit/flickit.cpp -o flickit_test
          ./flickit_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_pattern_test.cpp src/Flickit/flickit.cpp -o flickit_pattern_test
          ./flickit_pattern_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_grind_test.cpp src/Flickit/flickit.cpp -o flickit_grind_test
          ./flickit_grind_test scripts/qb/source/scripts/game/skater
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_physics_test.cpp src/Flickit/flickit.cpp -o flickit_physics_test
          ./flickit_physics_test scripts/qb/source/scripts/game/skater
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_pose_test.cpp -o flickit_pose_test
          ./flickit_pose_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/flickit_stance_test.cpp src/Flickit/flickit.cpp -o flickit_stance_test
          ./flickit_stance_test scripts/qb/source/scripts/game/skater
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/nodenames_test.cpp -o nodenames_test
          ./nodenames_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/watchdog_test.cpp -o watchdog_test
          ./watchdog_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/autosave_test.cpp -o autosave_test
          ./autosave_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/camrel_test.cpp -o camrel_test
          ./camrel_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/worldmap_test.cpp -o worldmap_test
          ./worldmap_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/drive_test.cpp -o drive_test
          ./drive_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/guard_test.cpp -o guard_test
          ./guard_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/players_test.cpp -o players_test
          ./players_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/gamefiles_test.cpp -o gamefiles_test
          ./gamefiles_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/crash_test.cpp -o crash_test
          ./crash_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/peds_test.cpp -o peds_test
          ./peds_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/daynight_test.cpp -o daynight_test
          ./daynight_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/facelist_test.cpp -o facelist_test
          ./facelist_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/str_test.cpp -o str_test
          ./str_test
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -I src/Flickit tests/frames_test.cpp -o frames_test
          ./frames_test
      - name: Flickit's car and player scripts
        run: |
          # the compiler gives the game's own compiled files for these sources (but for the order of the names)
          for f in game/misc/car_scripts game/player_controlled_vehicle game/skater/switch_control game/goal_utilities thugsdl/thugsdl_scripts; do
            python3 scripts/flickit/qbc.py --check scripts/qb/source/scripts/$f.q scripts/qb/compiled/scripts/$f.qb
          done
          # and src/Flickit/flickit_cars_qb.h is what scripts/flickit/cars.q compiles to, src/Flickit/flickit_players_qb.h players.q,
          # src/Flickit/flickit_daynight_qb.h daynight.q
          python3 scripts/flickit/qbc.py --header scripts/flickit/cars.q /tmp/flickit_cars_qb.h
          diff /tmp/flickit_cars_qb.h src/Flickit/flickit_cars_qb.h
          python3 scripts/flickit/qbc.py --header scripts/flickit/players.q /tmp/flickit_players_qb.h
          diff /tmp/flickit_players_qb.h src/Flickit/flickit_players_qb.h
          python3 scripts/flickit/qbc.py --header scripts/flickit/daynight.q /tmp/flickit_daynight_qb.h
          diff /tmp/flickit_daynight_qb.h src/Flickit/flickit_daynight_qb.h

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (x86)
        run: vcpkg install sdl2:x86-windows

      - name: Configure, default Release flags
        run: >
          cmake -S . -B build-default -A Win32
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x86-windows
          -DFLICKIT_BUILD=${{ github.sha }}

      - name: Build, default Release flags
        run: cmake --build build-default --config Release --target THUG_SDL

      - name: Configure, optimization off
        run: >
          cmake -S . -B build-unoptimized -A Win32
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x86-windows
          -DFLICKIT_BUILD=${{ github.sha }}
          "-DCMAKE_CXX_FLAGS_RELEASE=/MD /Od /DNDEBUG"
          "-DCMAKE_C_FLAGS_RELEASE=/MD /Od /DNDEBUG"

      - name: Build, optimization off
        run: cmake --build build-unoptimized --config Release --target THUG_SDL

      # The guard's write breakpoint, tried on Windows itself: src/Flickit/guard_game.cpp watching a word of a test
      # program's (32-bit, as the game is), written over from threads old and new. Both builds. Its result is
      # read from the log: a failure here does not keep the DLL from the run.
      - name: The guard on Windows
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($tree in 'build-default', 'build-unoptimized') {
            cmake --build $tree --config Release --target guard_windows_test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = (Get-ChildItem -Recurse $tree -Filter guard_windows_test.exe | Select-Object -First 1).FullName
            Write-Host "== $exe"
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The watch on the frames, tried on Windows itself: src/Flickit/frames_game.cpp watching a test program that
      # plays the game's part (frames that are fast, slow, and one that hangs in a Sleep), with the second thread
      # that stops it and looks where it is. Its result is read from the log, like the guard's.
      - name: The watch on the frames on Windows
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($tree in 'build-default', 'build-unoptimized') {
            cmake --build $tree --config Release --target frames_windows_test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = (Get-ChildItem -Recurse $tree -Filter frames_windows_test.exe | Select-Object -First 1).FullName
            Write-Host "== $exe"
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out, out/alt-unoptimized | Out-Null
          Copy-Item (Get-ChildItem -Recurse build-default -Filter thugsdl.dll | Select-Object -First 1).FullName out/thugsdl.dll
          Copy-Item (Get-ChildItem -Recurse build-unoptimized -Filter thugsdl.dll | Select-Object -First 1).FullName out/alt-unoptimized/thugsdl.dll
          Copy-Item .github/flickit/INSTALL.txt out/INSTALL.txt
          Copy-Item -Recurse .github/flickit/large-address out/large-address
          $ini = Get-Content Game/thugsdl.ini
          $start = [array]::IndexOf($ini, '[Flickit]')
          if ($start -lt 0) { throw 'no [Flickit] section in Game/thugsdl.ini' }
          $ini[$start..($ini.Count - 1)] | Set-Content out/flickit-ini-section.txt
          Get-ChildItem -Recurse out | Format-Table Length, FullName

      - name: Check the built DLLs against the one shipped in Game/
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check pefile capstone
          python .github/flickit/check_dll.py --sdl2 Game/SDL2.dll Game/thugsdl.dll out/thugsdl.dll out/alt-unoptimized/thugsdl.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The grind hooks are called from the game's own code, so what the compiler made of them is looked at:
      # how each one returns has to fit the place it is called from. The disassembly goes into the log.
      - name: Check the grind hooks in the built DLLs
        shell: pwsh
        run: |
          python .github/flickit/check_hooks.py out/thugsdl.dll out/alt-unoptimized/thugsdl.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The guard writes down where a stray write came from; in the DLL, that is thugsdl.dll and how far into it.
      # The linker's map of the optimized build says which of the DLL's functions that is: its own part goes
      # into the log.
      - name: Where the DLL's own functions are (from the linker's map)
        continue-on-error: true
        shell: pwsh
        run: |
          $map = Get-ChildItem -Recurse build-default -Filter thugsdl.map | Select-Object -First 1
          if (-not $map) { throw 'no thugsdl.map from the linker' }
          python .github/flickit/map_functions.py $map.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: thugsdl-flickit
          path: out/
          if-no-files-found: error
